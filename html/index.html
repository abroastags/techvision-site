<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const ASSETS = '../public/assets/';

/* ── Header ──────────────────────────────────────────────────────── */
function Header({ activeSection }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 16);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const links = [
    { id: 'work',    label: 'Work' },
    { id: 'do',      label: 'What we do' },
    { id: 'ops',     label: 'Operations' },
    { id: 'company', label: 'Company' },
  ];
  return (
    <header className={`tv-nav ${scrolled ? 'is-scrolled' : ''}`}>
      <a href="#top" className="tv-nav__brand" aria-label="techvision home">
        <img src={ASSETS + 'techvision-mark.png'} alt="" width="26" height="26" />
        <span>techvision</span>
      </a>
      <nav className="tv-nav__links" aria-label="Primary">
        {links.map(l => (
          <a key={l.id} href={`#${l.id}`} className={activeSection === l.id ? 'is-active' : ''}>
            {l.label}
          </a>
        ))}
      </nav>
      <div className="tv-nav__spacer" />
      <div className="tv-nav__status" title="Live status">
        <span className="tv-status-dot tv-status-dot--ok" />
        <span className="tv-mono">All systems · 99.997%</span>
      </div>
      <a href="#contact" className="tv-btn tv-btn--primary tv-btn--sm">
        Start a project <span aria-hidden="true">→</span>
      </a>
    </header>
  );
}

/* ── Hero ─────────────────────────────────────────────────────────── */

        </div>

          Built like a city<br/>runs on it.
        </h1>

          <div className="tv-hero__actions">

/* ── StatusTicker ─────────────────────────────────────────────────── */
function StatusTicker() {
  const items = [
    'binimoy.gov.bd · 200 OK · 47ms',
    'power-erp-dse · 15/15 nodes healthy',
    'proxy-vote-prod · last block 1 sec ago',
    'dncc-app · 4.1M sessions / mo',
    'ncc-imaging · model v2.3 · p95 1.2s',
    'compliance-aml · 0 stale alerts',
    '▾ we answer the phone at 3am',
  ];
  const doubled = [...items, ...items];
  return (
    <div className="tv-ticker" aria-hidden="true">
      <div className="tv-ticker__track">
        {doubled.map((t, i) => (
          <span key={i} className="tv-ticker__item">
            <span className="tv-status-dot tv-status-dot--ok" />
            <span className="tv-mono">{t}</span>
          </span>
        ))}
      </div>
    </div>
  );
}

/* ── CaseCard ─────────────────────────────────────────────────────── */
function CaseCard({ tag, name, claim, blurb, region, year, metric, metricLabel }) {
  return (
    <article className="tv-case">
      <div className="tv-eyebrow tv-case__eyebrow">
        {tag}
      </div>
      <h3 className="tv-case__title">{name}</h3>
      <p className="tv-case__claim">{claim}</p>
      <p className="tv-case__blurb">{blurb}</p>
      <div className="tv-case__meta">
        <span>{region} · {year}</span>
        <span className="tv-case__metric">{metricLabel} <b>{metric}</b></span>
      </div>
    </article>
  );
}

/* ── WorkGrid ─────────────────────────────────────────────────────── */
const CASES = [

    blurb: "Asset management, finance and HR on one platform — every utility under Bangladesh's Power Division.",
    region: 'BD', year: '2017→', metric: '99.997%', metricLabel: 'Uptime' },
  { id: 2, tag: 'Bangladesh Bank', sector: 'fintech', name: 'Binimoy IDTP', claim: "Bangladesh's interoperable digital transaction platform.",
    blurb: "National rails connecting banks, MFS and PSPs. We own the platform's reference implementation.",
    region: 'BD', year: '2022→', metric: '38M', metricLabel: 'Tx / mo' },
  { id: 3, tag: 'DNCC', sector: 'gov', name: 'DNCC citizen app', claim: 'One app for everything the city does.',
    blurb: 'Holding tax, trade licences, garbage pickup, complaint routing — for Dhaka North City Corporation.',
    region: 'BD', year: '2021→', metric: '4.1M', metricLabel: 'Sessions / mo' },
  { id: 4, tag: 'NCC', sector: 'ai', name: 'Cardiac imaging AI', claim: 'AI imaging for the National Cardiovascular Center.',
    blurb: 'Reads echocardiograms in seconds, flags anomalies for the senior cardiologist. On-prem inference.',

  { id: 5, tag: 'US Fintech', sector: 'chain', name: 'Proxy voting on chain', claim: 'Blockchain settlement for the second-largest shareholder firm.',
    blurb: 'Every record reconciles, every vote is auditable, AML clean.',
    region: 'USA', year: '2023→', metric: '4.1M', metricLabel: 'Records' },

    blurb: 'Custody, secondary market, royalty splits. Built so the front office never has to think about it.',
    region: 'USA', year: '2022→', metric: '0', metricLabel: 'Incidents' },

    blurb: 'AML alerts, CRA assessment reports, HMDA LAR generation — one platform, four bank clients.',

const FILTERS = [

function WorkGrid() {
  const [filter, setFilter] = useState('all');

/* ── Capabilities ─────────────────────────────────────────────────── */

/* ── ThreeAm ──────────────────────────────────────────────────────── */
function ThreeAm() {

    <section id="ops" className="tv-3am">

        <header className="tv-section-break tv-section-break--inverse">
          <span className="tv-mono tv-section-break__num">03</span>
          <h2 className="tv-section-break__title">Operations</h2>

        <div className="tv-3am__cols">

/* ── ContactBlock ─────────────────────────────────────────────────── */
function ContactBlock() {
  const [form, setForm] = useState({ name: '', email: '', org: '', project: 'erp', message: '', oncall: false });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const submit = (e) => {
    e.preventDefault();
    const err = {};
    if (!form.name.trim()) err.name = 'Required.';
    if (!form.email.match(/.+@.+\..+/)) err.email = 'Need a real email.';
    if (!form.message.trim()) err.message = 'One sentence is fine.';
    setErrors(err);
    if (Object.keys(err).length === 0) setSent(true);
  };
  if (sent) {
    return (
      <section id="contact" className="tv-section tv-contact">
        <header className="tv-section-break">
          <span className="tv-mono tv-section-break__num">04</span>
          <h2 className="tv-section-break__title">Start a project</h2>
        </header>
        <div className="tv-contact__confirm">
          <div className="tv-eyebrow">Received · ticket TV-{Math.floor(Math.random()*8999+1000)}</div>
          <h3 className="tv-contact__confirm-title">Thanks, {form.name.split(' ')[0]}. We'll be in touch within one business day.</h3>
          <p>If it's urgent, the pager is <span className="tv-mono">+880 2 — answered 24/7</span>.</p>
          <button type="button" className="tv-btn tv-btn--ghost"
                  onClick={() => { setSent(false); setForm({ name: '', email: '', org: '', project: 'erp', message: '', oncall: false }); }}>
            Send another
          </button>
        </div>
      </section>
    );
  }
  return (
    <section id="contact" className="tv-section tv-contact">
      <header className="tv-section-break">
        <span className="tv-mono tv-section-break__num">04</span>
        <h2 className="tv-section-break__title">Start a project</h2>
        <span className="tv-mono tv-section-break__meta">we read every one</span>
      </header>
      <div className="tv-contact__layout">
        <div className="tv-contact__left">
          <h3 className="tv-contact__pitch">If it has to work,<br/>we want to build it.</h3>
          <p className="tv-contact__sub">One sentence about what you need is enough to start. We'll reply with a real engineer, not a sales rep.</p>
          <div className="tv-contact__addr">
            <div><span className="tv-mono">Dhaka</span><br/>House 42, Road 11, Banani</div>
            <div><span className="tv-mono">New York</span><br/>By appointment · Midtown</div>
          </div>
        </div>
        <form className="tv-contact__form" onSubmit={submit} noValidate>
          <div className="tv-field">
            <label htmlFor="cn">Name</label>
            <input id="cn" type="text" value={form.name} onChange={e => update('name', e.target.value)} aria-invalid={!!errors.name} />
            {errors.name && <span className="tv-field__error">{errors.name}</span>}
          </div>
          <div className="tv-field">
            <label htmlFor="ce">Email</label>
            <input id="ce" type="email" value={form.email} onChange={e => update('email', e.target.value)} aria-invalid={!!errors.email} />
            {errors.email && <span className="tv-field__error">{errors.email}</span>}
          </div>
          <div className="tv-field">
            <label htmlFor="co">Organisation</label>
            <input id="co" type="text" value={form.org} onChange={e => update('org', e.target.value)} placeholder="optional" />
          </div>
          <div className="tv-field">
            <label htmlFor="cp">What needs to work</label>
            <select id="cp" value={form.project} onChange={e => update('project', e.target.value)}>
              <option value="erp">ERP / back-office</option>
              <option value="compliance">Banking compliance</option>
              <option value="chain">Blockchain / settlement</option>
              <option value="ai">Clinical AI</option>
              <option value="other">Something else</option>
            </select>
          </div>
          <div className="tv-field tv-field--wide">
            <label htmlFor="cm">One sentence is fine.</label>
            <textarea id="cm" rows="3" value={form.message} onChange={e => update('message', e.target.value)} aria-invalid={!!errors.message} />
            {errors.message && <span className="tv-field__error">{errors.message}</span>}
          </div>
          <label className="tv-checkbox tv-field--wide">
            <input type="checkbox" checked={form.oncall} onChange={e => update('oncall', e.target.checked)} />
            <span className="tv-checkbox__box" aria-hidden="true"><span /></span>
            <span>I need on-call coverage included</span>
          </label>
          <div className="tv-field--wide tv-contact__submit">
            <button className="tv-btn tv-btn--primary" type="submit">Send <span aria-hidden="true">→</span></button>
            <span className="tv-mono tv-contact__hint">We reply within one business day.</span>
          </div>
        </form>
      </div>
    </section>
  );
}

/* ── App ──────────────────────────────────────────────────────────── */
function App() {
  const [active, setActive] = useState('top');
  useEffect(() => {
    const ids = ['work', 'do', 'ops', 'company'];
    const els = ids.map(id => document.getElementById(id)).filter(Boolean);
    const observer = new IntersectionObserver(
      (entries) => { for (const e of entries) { if (e.isIntersecting) setActive(e.target.id); } },
      { rootMargin: '-40% 0px -55% 0px', threshold: 0 }
    );
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
  useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (href.length < 2) return;
      const target = document.querySelector(href);
      if (!target) return;
      e.preventDefault();
      const top = target.getBoundingClientRect().top + window.scrollY - 60;
      window.scrollTo({ top, behavior: 'smooth' });
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
  return (
    <React.Fragment>
      <Header activeSection={active} />
      <Hero />
      <StatusTicker />
      <WorkGrid />
      <Capabilities />
      <ThreeAm />
      <ProofRow />
      <ContactBlock />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
